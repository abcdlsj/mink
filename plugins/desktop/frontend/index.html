<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumi</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">Sumi</div>
      <div class="status" id="status">claude-sonnet-4 · Ready</div>
    </header>

    <aside class="left">
      <div class="left-head">
        <button class="btn" id="new-conv">
          <span class="icon" data-icon="plus"></span> New
        </button>
        <button class="btn search-trigger" id="open-palette">
          <span class="icon" data-icon="search"></span>
          <span>Search</span>
          <span class="kbd">⌘K</span>
        </button>
      </div>

      <div class="group-label">Channels</div>
      <ul class="nav-list" id="channels"></ul>

      <div class="group-label">Direct Agents</div>
      <ul class="nav-list" id="agents"></ul>

      <div class="group-label">Recent Threads</div>
      <ul class="nav-list" id="threads"></ul>
    </aside>

    <main class="center">
      <div class="conv-head">
        <div>
          <div class="conv-title" id="conv-title">Channel</div>
          <div class="conv-meta" id="conv-meta"></div>
        </div>
        <div class="conv-actions">
          <button class="btn outline danger" id="stop-btn" hidden>
            <span class="icon" data-icon="square"></span> Stop run
          </button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="input" placeholder="Message #channel..." rows="2"></textarea>
          <div class="composer-row">
            <select id="agent-select" class="select"></select>
            <select id="model-select" class="select"></select>
            <span class="grow"></span>
            <button class="btn primary" id="send-btn">Send</button>
          </div>
        </div>
      </div>
    </main>

    <aside class="right" id="right"></aside>
  </div>

  <div class="palette" id="palette" hidden>
    <div class="palette-box">
      <input id="palette-input" type="text" placeholder="Search #channel, thread, @agent, /command, model" autocomplete="off">
      <div class="palette-results" id="palette-results"></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="identicon.js"></script>
  <script src="app.js"></script>
</body>
</html>
