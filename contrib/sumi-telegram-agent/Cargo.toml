[package]
name = "sumi-telegram-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Telegram bot conversation plugin for the Sumi builtin agent"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
hex = "0.4"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sumi-builtin-agent = { path = "../../crates/sumi-builtin-agent" }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v5", "v7"] }

[dev-dependencies]
tempfile = "3.0"
