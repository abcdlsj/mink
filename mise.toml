[tools]
rust = "1.97.0"
node = "24"
pnpm = "10.26.0"

[env]
RUST_BACKTRACE = "1"
SUMI_TEST_DATABASE_URL = "postgres://localhost/postgres"

[tasks.install]
description = "Install Rust and Web dependencies"
run = '''
cargo fetch
pnpm --dir web install --frozen-lockfile
'''

[tasks.build-server]
description = "Build the sumi binary"
run = "cargo build"

[tasks.build-web]
description = "Build the WebUI"
run = "pnpm --dir web build"

[tasks.generate-api-types]
description = "Generate Browser API TypeScript types from Rust OpenAPI"
run = "pnpm --dir web generate:api"

[tasks.check-api-types]
description = "Check Browser API TypeScript types match Rust OpenAPI"
run = "pnpm --dir web check:api"

[tasks.build]
description = "Build the server, daemon, CLI, and WebUI"
depends = ["build-server", "build-web"]

[tasks.lint-server]
description = "Format-check and lint Rust"
run = '''
cargo fmt --all -- --check
cargo clippy --all-targets --all-features -- -D warnings
'''

[tasks.lint-web]
description = "Typecheck and lint the WebUI"
run = '''
pnpm --dir web check:api
pnpm --dir web lint
'''

[tasks.lint]
description = "Lint Rust and Web code"
depends = ["lint-server", "lint-web"]

[tasks.test-server]
description = "Run Rust unit, CLI, and PostgreSQL integration tests"
run = "cargo test --all-features"

[tasks.test-web]
description = "Run WebUI unit and component tests"
run = "pnpm --dir web test"

[tasks.test-dev-seed]
description = "Run local development seed tests"
run = "node --test scripts/dev-seed.test.mjs"

[tasks.test-e2e]
description = "Run the Playwright browser acceptance suite"
run = "pnpm --dir web test:e2e"

[tasks.test]
description = "Run the complete local test suite"
depends = ["test-server", "test-web", "test-dev-seed"]

[tasks.db-start]
description = "Start PostgreSQL 17 and create the local development database on macOS"
run = '''
if ! command -v brew >/dev/null 2>&1; then
  echo "db-start is for macOS with Homebrew; start PostgreSQL 17 using your system service manager" >&2
  exit 1
fi
brew services start postgresql@17
pg_bin="$(brew --prefix postgresql@17)/bin"
if ! "$pg_bin/psql" --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'sumi_dev'" | grep -qx 1; then
  "$pg_bin/createdb" sumi_dev
else
  installed_version="$("$pg_bin/psql" --dbname sumi_dev --tuples-only --no-align --command "SELECT max(version) FROM schema_meta" 2>/dev/null || true)"
  if [ "$installed_version" != "1" ]; then
    echo "sumi_dev uses an incompatible schema baseline; recreating the development database" >&2
    "$pg_bin/dropdb" --force sumi_dev
    "$pg_bin/createdb" sumi_dev
  fi
fi
'''

[tasks.run]
description = "Run the local Sumi server"
env = { SUMI_SERVER__DATABASE_URL = "postgres://localhost/sumi_dev" }
run = "cargo run -- server"

[tasks.dev]
description = "Run the Rust server and Vite development server"
env = { SUMI_SERVER__DATABASE_URL = "postgres://localhost/sumi_dev" }
run = '''
trap 'kill 0' EXIT INT TERM
cargo run -- server &
pnpm --dir web dev &
if [ "${SUMI_DEV_SEED:-0}" = "1" ]; then
  node scripts/dev-seed.mjs &
fi
wait
'''

[tasks.dev-seed]
description = "Run or clean the stable sumi-dev Space, Dev Computer, and PM/Coder/Reviewer group"
env = { SUMI_DEV_SEED = "1", RUST_LOG = "sumi=warn,tower_http=warn" }
run = "sh scripts/dev-seed-task.sh"
