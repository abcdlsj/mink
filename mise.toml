[tools]
go = "1.26.5"
node = "22"
"go:github.com/bufbuild/buf/cmd/buf" = "1.72.0"
"go:github.com/wailsapp/wails/v2/cmd/wails" = "2.12.0"
"go:honnef.co/go/tools/cmd/staticcheck" = "0.6.1"

[tasks.install]
description = "Install Go and Web dependencies"
run = '''
go mod download
npm ci --prefix web
'''

[tasks.generate]
description = "Generate Go and TypeScript API code"
run = "buf generate"

[tasks.format]
description = "Format source files"
run = '''
gofmt -w cmd gen internal
npm run format --prefix web
'''

[tasks.lint]
description = "Run API, Go, and Web static checks"
run = '''
buf lint
go vet ./...
staticcheck ./...
npm run typecheck --prefix web
'''

[tasks.test]
description = "Run Go and Web tests"
run = '''
go test ./...
npm test --prefix web
'''

[tasks."test:e2e"]
description = "Run browser release validation against a supplied Sumi Server"
run = '''
: "${PLAYWRIGHT_OWNER_KEY_FILE:?set PLAYWRIGHT_OWNER_KEY_FILE to the 0600 owner credential file}"
npm run test:e2e --prefix web
'''

[tasks.build]
description = "Build production Web and Go binaries"
run = '''
npm run build --prefix web
go build ./...
mise run build:desktop
'''

[tasks."build:desktop"]
description = "Build the production Desktop application without debug tools"
run = "cd desktop && wails build -clean -trimpath -m -nosyncgomod -skipbindings -skipembedcreate"

[tasks.package]
description = "Build a verified clean-machine release bundle"
run = '''
: "${SUMI_VERSION:?set SUMI_VERSION}"
: "${SUMI_BUNDLE_OUT:?set SUMI_BUNDLE_OUT}"
mkdir -p bin
go build -o bin/sumi ./cmd/sumi
go build -o bin/sumi-package ./cmd/sumi-package
bin/sumi-package --version "$SUMI_VERSION" --os "$(go env GOOS)" --arch "$(go env GOARCH)" --binary bin/sumi --web web/dist --out "$SUMI_BUNDLE_OUT"
'''

[tasks."dev:server"]
description = "Run the local Sumi Server"
run = "go run ./cmd/sumi-server --data-root ${SUMI_DATA_ROOT:-$HOME/.sumi}"

[tasks."dev:web"]
description = "Run the Vite Web client"
run = "npm run dev --prefix web"

[tasks.dev]
description = "Run Sumi Server and Web together"
depends = ["dev:server", "dev:web"]
