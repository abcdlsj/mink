[package]
name = "sumi-builtin-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Sumi Computer harness: prompts and context compaction for the builtin agent"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sumi-agent-core = { path = "../sumi-agent-core" }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
