[workspace]
members = ["crates/sumi-agent-core", "crates/sumi-builtin-agent"]
resolver = "2"

[package]
name = "sumi"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A shared collaboration space for humans and agents"
license = "MIT"
autotests = false

[[bin]]
name = "sumi"
path = "src/main.rs"

[[test]]
name = "architecture_boundaries"
path = "tests/normal/architecture_boundaries.rs"

[[test]]
name = "attachment_flow"
path = "tests/normal/attachment_flow.rs"

[[test]]
name = "brain_in_vat"
path = "tests/brain_in_vat.rs"

[[test]]
name = "builtin_harness_benchmark"
path = "tests/builtin_harness_benchmark.rs"

[[test]]
name = "cli"
path = "tests/normal/cli.rs"

[[test]]
name = "dm_run_focus"
path = "tests/normal/dm_run_focus.rs"

[[test]]
name = "failure_recovery"
path = "tests/normal/failure_recovery.rs"

[[test]]
name = "governance_routes"
path = "tests/normal/governance_routes.rs"

[[test]]
name = "agent_graph"
path = "tests/normal/agent_graph.rs"

[[test]]
name = "computer_llm_usage"
path = "tests/normal/computer_llm_usage.rs"

[[test]]
name = "inbox_direct_message"
path = "tests/normal/inbox_direct_message.rs"

[[test]]
name = "registration_space"
path = "tests/normal/registration_space.rs"

[[test]]
name = "space_invitation"
path = "tests/normal/space_invitation.rs"

[[test]]
name = "werewolf_communication"
path = "tests/werewolf_communication.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
async-openai = { version = "0.41", default-features = false, features = ["byot", "chat-completion", "rustls"] }
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
clap = { version = "4.5", features = ["derive", "env"] }
figment = { version = "0.10", features = ["env", "toml"] }
futures-util = "0.3"
hex = "0.4"
hostname = "0.4"
libc = "0.2"
object_store = { version = "0.12", features = ["aws"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
rand = "0.8.7"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "time"] }
sumi-agent-core = { path = "crates/sumi-agent-core" }
sumi-builtin-agent = { path = "crates/sumi-builtin-agent" }
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1.0", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "signal", "net", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
utoipa = { version = "5.4", features = ["time", "uuid"] }
uuid = { version = "1.0", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
