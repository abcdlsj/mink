[package]
name = "sumi"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A shared collaboration space for humans and agents"
license = "MIT"

[[bin]]
name = "sumi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
email_address = "0.2"
figment = { version = "0.10", features = ["env", "toml"] }
getrandom = "0.4"
governor = "0.10"
futures-util = "0.3"
hex = "0.4"
hostname = "0.4"
libc = "0.2"
object_store = { version = "0.12", features = ["aws"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slug = "0.1"
subtle = "2.6"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "migrate", "uuid", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1.0", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "signal", "net", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v7"] }
zeroize = "1.8"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
