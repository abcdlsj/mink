syntax = "proto3";

package sumi.delivery.v1;

import "google/protobuf/timestamp.proto";
import "sumi/inbox/v1/inbox.proto";
import "sumi/space/v1/space.proto";

option go_package = "github.com/abcdlsj/sumi/gen/go/sumi/delivery/v1;deliveryv1";

service DeliveryService {
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);
  rpc AcceptDelivery(AcceptDeliveryRequest) returns (AcceptDeliveryResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ClaimRun(ClaimRunRequest) returns (ClaimRunResponse);
  rpc RenewRun(RenewRunRequest) returns (RenewRunResponse);
  rpc CompleteRun(CompleteRunRequest) returns (CompleteRunResponse);
}

enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_AVAILABLE = 1;
  DELIVERY_STATE_ACCEPTED = 2;
  DELIVERY_STATE_COMPLETED = 3;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_ACCEPTED = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_COMPLETED = 3;
}

enum RunOutcome {
  RUN_OUTCOME_UNSPECIFIED = 0;
  RUN_OUTCOME_SUCCEEDED = 1;
  RUN_OUTCOME_FAILED = 2;
}

enum RunLaunchCloseReason {
  RUN_LAUNCH_CLOSE_REASON_UNSPECIFIED = 0;
  RUN_LAUNCH_CLOSE_REASON_REPLACED = 1;
  RUN_LAUNCH_CLOSE_REASON_COMPLETED = 2;
}

message Delivery {
  uint64 sequence = 1;
  string id = 2;
  string agent_id = 3;
  string inbox_item_id = 4;
  string trigger_message_id = 5;
  string space_id = 6;
  sumi.space.v1.MessageTarget target = 7;
  uint64 trigger_target_sequence = 8;
  DeliveryState state = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp accepted_at = 11;
  google.protobuf.Timestamp completed_at = 12;
}

message Run {
  string id = 1;
  string delivery_id = 2;
  string agent_id = 3;
  uint64 basis_target_sequence = 4;
  RunState state = 5;
  RunOutcome outcome = 6;
  oneof result_ref {
    string result_message_id = 7;
    string result_held_draft_id = 8;
  }
  google.protobuf.Timestamp accepted_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
}

message RunLaunch {
  string id = 1;
  string run_id = 2;
  string agent_id = 3;
  string holder_computer_id = 4;
  uint64 holder_placement_generation = 5;
  uint64 fence = 6;
  google.protobuf.Timestamp claimed_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp closed_at = 9;
  RunLaunchCloseReason close_reason = 10;
}

message ListDeliveriesRequest {
  uint64 after_sequence = 1;
  uint32 limit = 2;
}

message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;
  uint64 next_sequence = 2;
  Run active_run = 3;
  RunLaunch active_launch = 4;
  Delivery active_delivery = 5;
}

message AcceptDeliveryRequest {
  string request_id = 1;
  string delivery_id = 2;
}

message AcceptDeliveryResponse {
  Run run = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ClaimRunRequest {
  string request_id = 1;
  string run_id = 2;
}

message ClaimRunResponse {
  RunLaunch launch = 1;
}

message RenewRunRequest {
  string request_id = 1;
  string run_id = 2;
  string launch_id = 3;
  uint64 fence = 4;
}

message RenewRunResponse {
  RunLaunch launch = 1;
}

message CompleteRunRequest {
  string request_id = 1;
  string outbox_event_id = 2;
  string run_id = 3;
  string launch_id = 4;
  uint64 fence = 5;
  RunOutcome outcome = 6;
  string body = 7;
  repeated string mentioned_agent_ids = 8;
}

message CompleteRunResponse {
  Run run = 1;
  oneof result {
    sumi.space.v1.Message message = 2;
    sumi.inbox.v1.HeldDraft held_draft = 3;
  }
  google.protobuf.Timestamp committed_at = 4;
}
