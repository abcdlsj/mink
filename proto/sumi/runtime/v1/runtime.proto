syntax = "proto3";

package sumi.runtime.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/abcdlsj/sumi/gen/go/sumi/runtime/v1;runtimev1";

service RuntimeService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc RenewSession(RenewSessionRequest) returns (RenewSessionResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
}

message Session {
  string agent_id = 1;
  string computer_id = 2;
  uint64 placement_desired_revision = 3;
  string token = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message CreateSessionRequest {
  string computer_id = 1;
  string registration_key = 2;
  string agent_id = 3;
  uint64 placement_desired_revision = 4;
}

message CreateSessionResponse {
  Session session = 1;
}

message RenewSessionRequest {
  string computer_id = 1;
  string registration_key = 2;
}

message RenewSessionResponse {
  Session session = 1;
}

message RevokeSessionRequest {
  string computer_id = 1;
  string registration_key = 2;
}

message RevokeSessionResponse {}
