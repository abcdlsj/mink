active_model = "main"
default_model = "main"
runtime = "codex"
web_addr = "127.0.0.1:7788"

[api_keys]
OPENAI_API_KEY = "${OPENAI_API_KEY}"

[models.main]
provider = "openai"
model = "gpt-4.1-mini"
api_key = "OPENAI_API_KEY"

