active_model = "main"
default_model = "main"
runtime = "codex"
web_addr = "127.0.0.1:7788"

[api_keys]
OPENAI_API_KEY = "${OPENAI_API_KEY}"

[models.main]
provider = "openai"
model = "gpt-4.1-mini"
api_key = "OPENAI_API_KEY"
max_tokens = 8192
context_window = 128000

# Optional compact defaults.
# [compact]
# auto = true
# trigger_messages = 80
# keep_recent_messages = 8
# reserve_tokens = 2048
#
# Hard-overflow guard for EXTERNAL driver runtimes (claude / codex).
# A native runtime's usable input ceiling is derived from its model's
# context_window (minus max_tokens output reserve and reserve_tokens margin),
# so the hard guard always applies to native. An external driver runs its own
# model behind a CLI: its real context window is owned by the driver and is NOT
# the active (summarizer) model's window, so sumi does NOT guess it. The hard
# guard is enforceable for an external driver ONLY when you declare its usable
# INPUT ceiling here. The value is the input ceiling directly (tokens) — it is
# not a context window from which output reserves are subtracted.
#   - configured (> 0): overflow is compacted, and fails closed (visible error)
#     if it still cannot fit — never silently truncated.
#   - absent / unknown: the guard stands down (UNGUARDED) and the external
#     driver owns and reports its own overflow.
# Set each value to the driver's confirmed usable INPUT ceiling in tokens. These
# are per-driver and version-specific — look them up for the driver/model you
# actually run; do NOT copy a placeholder as if it were a recommended default.
# [external_input_budgets]
# claude = <driver input-token ceiling>   # e.g. read from your claude driver's docs
# codex  = <driver input-token ceiling>   # e.g. read from your codex driver's docs
#
# Optional.
# data_dir = "/path/to/.sumi"
# workspace = "/path/to/repo"
# soul_path = "/path/to/SOUL.md"
# prompt = "Project-specific system prompt"
# [telegram]
# token = "..."
# mention_mode = "always"
# session_scope = "chat"
# allowed_user_ids = []
# allowed_chat_ids = []
# Telegram tool approvals are persisted under data_dir/state/permissions.json.
# [notify]
# bark_url = "https://api.day.app/your-key"
# [emby]
# server = "https://emby.example"
# username = "..."
# password = "..."
# [brave_search]
# api_key = "..."
