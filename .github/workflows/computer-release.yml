name: Computer release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target "${{ matrix.target }}"
          rustup override set 1.97.0

      - name: Resolve release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sumi") | .version')"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not resolve the sumi package version" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" != "v$version" ]]; then
            echo "Tag $REF_NAME must match Cargo package version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary and packager
        shell: bash
        run: |
          cargo build --release --locked
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$host" != "${{ matrix.target }}" ]]; then
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package Computer release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          artifact="target/release/sumi"
          if [[ "$host" != "$RELEASE_TARGET" ]]; then
            artifact="target/$RELEASE_TARGET/release/sumi"
          fi
          output="dist/sumi-computer-$RELEASE_VERSION-$RELEASE_TARGET"
          ./target/release/sumi release computer \
            --artifact "$artifact" \
            --version "$RELEASE_VERSION" \
            --target "$RELEASE_TARGET" \
            --output-dir "$output"
          cp "$output/sumi-$RELEASE_VERSION-$RELEASE_TARGET" dist/
          tar -C dist -czf "$output.tar.gz" "$(basename "$output")"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sumi-computer-${{ steps.release.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/sumi-${{ steps.release.outputs.version }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download Computer release bundles
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: sumi-computer-*
          path: dist
          merge-multiple: true

      - name: Generate bundle checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
