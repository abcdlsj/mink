name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        run: |
          # Extract version info
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          BUILDTIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          
          LDFLAGS="-X github.com/abcdlsj/mink.Version=${VERSION} \
                   -X github.com/abcdlsj/mink.Commit=${COMMIT} \
                   -X github.com/abcdlsj/mink.BuildTime=${BUILDTIME} \
                   -s -w"

          platforms=(
            darwin/amd64
            darwin/arm64
            linux/amd64
            linux/arm64
          )

          for plat in "${platforms[@]}"; do
            GOOS=${plat%/*}
            GOARCH=${plat#*/}
            output="mink-${GOOS}-${GOARCH}"
            echo "Building $output..."
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o "$output" ./cmd/mink || exit 1
            ls -la "$output"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mink-darwin-amd64
            mink-darwin-arm64
            mink-linux-amd64
            mink-linux-arm64
          generate_release_notes: true
