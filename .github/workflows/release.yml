name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        run: |
          platforms=(
            linux/amd64
            linux/arm64
          )

          for plat in "${platforms[@]}"; do
            GOOS=${plat%/*}
            GOARCH=${plat#*/}
            output="mink-${plat}"
            echo "Building $output..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "$output" ./cmd/mink || exit 1
            ls -la "$output"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mink-linux-amd64
            mink-linux-arm64
          generate_release_notes: true
