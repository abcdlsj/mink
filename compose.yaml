name: sumi

services:
  # The compose stack runs the Server only; the Computer is manual-CLI only.
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: sumi
      POSTGRES_USER: sumi
      POSTGRES_PASSWORD: sumi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username sumi --dbname sumi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SUMI_SERVER__DATABASE_URL: postgres://sumi:sumi@postgres:5432/sumi
      RUST_LOG: ${RUST_LOG:-sumi=info,tower_http=info}
    ports:
      - "${SUMI_SERVER_PORT:-3000}:3000"
    volumes:
      - attachments:/var/lib/sumi/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  attachments:
